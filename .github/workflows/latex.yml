name: Build LaTeX PDFs

# Compiles the French original (sga4.5.tex) and the English edition
# (sga4.5-en.tex) on every push / PR. On pushes to master the PDFs are
# published to GitHub Pages (Settings -> Pages -> Source: GitHub Actions);
# on version tags (v*) they are attached to a GitHub Release.
on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # needed for releases
  pages: write    # needed for GitHub Pages deployment
  id-token: write # needed for GitHub Pages deployment

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Compile French edition (sga4.5.pdf)
        uses: xu-cheng/latex-action@v3
        with:
          root_file: sga4.5.tex
          args: -pdf -interaction=nonstopmode -halt-on-error -file-line-error

      - name: Compile English edition (sga4.5-en.pdf)
        uses: xu-cheng/latex-action@v3
        with:
          root_file: sga4.5-en.tex
          args: -pdf -interaction=nonstopmode -halt-on-error -file-line-error

      - name: Upload PDFs as build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pdfs
          path: |
            sga4.5.pdf
            sga4.5-en.pdf
          if-no-files-found: error

      - name: Prepare Pages site
        if: github.ref == 'refs/heads/master' && github.event_name == 'push'
        run: |
          mkdir -p public
          cp sga4.5.pdf public/sga4.5.pdf
          cp sga4.5-en.pdf public/sga4.5-en.pdf
          cp site/index.html public/index.html

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/master' && github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: Attach PDFs to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            sga4.5.pdf
            sga4.5-en.pdf

  deploy:
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
